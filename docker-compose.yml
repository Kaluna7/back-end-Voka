services:
  redis:
    image: redis:7-alpine
    container_name: moocha-redis
    ports:
      - "6379:6379"
    volumes:
      - moocha-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  moocha-redis-data:
